spring:
  application:
    name: trainer-workload-service
  activemq:
    broker-url: ${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASSWORD:admin}
  jms:
    pub-sub-domain: false
  security:
    jwt:
      secret: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY"
      expiration-minutes: 60

server:
  port: 8081
  servlet:
    context-path: /

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true
    leaseRenewalIntervalInSeconds: 10
    leaseExpirationDurationInSeconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.influencer: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  messaging:
    trainer-workload:
      queue: ${TRAINER_WORKLOAD_QUEUE:trainer.workload.queue}
      invalid-queue: ${TRAINER_WORKLOAD_INVALID_QUEUE:trainer.workload.invalid.dlq}

